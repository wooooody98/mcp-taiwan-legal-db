name: Taiwan legal MCP verification
on:
  push:
    branches:
      - diagnostics/tw-legal-mcp-20260913
    paths:
      - diagnostics/**
      - .github/workflows/tw-legal-mcp-verification.yml
permissions:
  contents: read
concurrency:
  group: tw-legal-mcp-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official legal MCP package
        run: python -m pip install --disable-pip-version-check 'mcp-taiwan-legal-db==1.0.1' requests
      - name: Install browser used by official MCP client
        timeout-minutes: 3
        run: python -m playwright install --with-deps chromium
      - name: Invoke both real MCP servers and retain JSON-RPC responses
        timeout-minutes: 8
        run: python -u diagnostics/mcp_probe.py
      - name: Preserve actual responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-legal-mcp-actual-responses
          path: mcp-results/
          if-no-files-found: warn
          retention-days: 1
