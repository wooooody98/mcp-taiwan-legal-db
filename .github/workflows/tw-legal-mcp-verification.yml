name: Taiwan legal MCP verification
on:
  push:
    branches:
      - diagnostics/tw-legal-mcp-20260913
    paths:
      - diagnostics/**
      - .github/workflows/tw-legal-mcp-verification.yml
permissions:
  contents: read
concurrency:
  group: tw-legal-mcp-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upstream source with compatible v1 MCP SDK
        run: python -m pip install --disable-pip-version-check 'mcp[cli]>=1,<2' 'git+https://github.com/lawchat-oss/mcp-taiwan-legal-db.git@03194e7b0a7437c7ed5e281d6d92c4a6df66ac65' requests
      - name: Install browser used by official MCP client
        timeout-minutes: 3
        run: python -m playwright install --with-deps chromium
      - name: Retrieve identified wage judgments through actual MCP calls
        timeout-minutes: 6
        run: |
          python -u - <<'PY'
          import sys, traceback
          sys.path.insert(0,'diagnostics')
          import mcp_probe as p
          c=None
          try:
              c=p.StdioMCP();p.init(c,'mcp-taiwan-legal-db')
              for jid in ['KLDV,115,基勞簡,1,20260715,1','TPDV,114,勞訴,133,20260612,1']:
                  p.call(c,'mcp-taiwan-legal-db','get_judgment',{'jid':jid})
              d=p.call(c,'mcp-taiwan-legal-db','search_judgments',{'keyword':'第123條','case_type':'民事','case_word':'勞訴','max_results':10})
              if isinstance(d,dict):
                  for row in d.get('results',[])[:4]:
                      if row.get('jid'):
                          p.call(c,'mcp-taiwan-legal-db','get_judgment',{'jid':row['jid']})
          except Exception:
              p.record('mcp-taiwan-legal-db','fatal_error',traceback.format_exc())
          finally:
              if c:c.close()
          PY
      - name: Preserve actual responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-legal-mcp-actual-responses
          path: mcp-results/
          if-no-files-found: warn
          retention-days: 1
